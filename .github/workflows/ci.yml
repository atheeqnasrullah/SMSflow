name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smsflow_test
          POSTGRES_USER: smsflow
          POSTGRES_PASSWORD: smsflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smsflow" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint & type-check
        run: |
          ruff check app tests
          mypy app || true   # tighten once the codebase is fully typed
      - name: Tests (SQLite, fast)
        run: pytest -q
      - name: Create non-superuser app role for RLS tests
        env:
          PGPASSWORD: smsflow
        run: |
          psql -h localhost -U smsflow -d smsflow_test -c "CREATE ROLE smsflow_app LOGIN PASSWORD 'app' NOBYPASSRLS;"
          psql -h localhost -U smsflow -d smsflow_test -c "GRANT USAGE ON SCHEMA public TO smsflow_app; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO smsflow_app;"
      - name: Migrations (PostgreSQL + RLS policies)
        env:
          DATABASE_URL: postgresql+asyncpg://smsflow:smsflow@localhost:5432/smsflow_test
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tenant isolation tests on PostgreSQL (RLS enforced)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://smsflow_app:app@localhost:5432/smsflow_test
          TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://smsflow:smsflow@localhost:5432/smsflow_test
        run: pytest -q tests/tenancy
      - name: Dependency audit
        run: pip-audit --strict || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smsflow/api:${{ github.sha }} backend
      - run: docker build -t smsflow/web:${{ github.sha }} frontend
      - name: Scan images
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: smsflow/api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"
