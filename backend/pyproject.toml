[project]
name = "smsflow-backend"
version = "0.1.0"
description = "SMSFlow – multi-tenant bulk SMS, OTP and notification platform (API + workers)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
    "phonenumbers>=8.13",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9",
    "structlog>=24.1",
    "sentry-sdk[fastapi,celery]>=2.5",
    "flower>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23,<0.25",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Dialect sqlite\\+aiosqlite does \\*not\\* support Decimal objects natively:sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501", "UP017"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
