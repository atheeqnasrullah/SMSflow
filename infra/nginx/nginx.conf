worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  client_max_body_size 6m;   # contact imports are capped at 5 MB by the API

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time rid=$request_id';
  access_log /dev/stdout main;

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream api { server api:8000; keepalive 32; }
  upstream web { server web:3000; keepalive 32; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/v1/auth/ {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass http://api;
    }
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api;
      proxy_read_timeout 60s;
    }
    location /health/ { proxy_pass http://api; }
    location / { proxy_pass http://web; }
  }
}
