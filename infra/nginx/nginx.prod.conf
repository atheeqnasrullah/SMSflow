worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  client_max_body_size 6m;

  log_format main escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","req":"$request","status":$status,'
                              '"bytes":$body_bytes_sent,"rt":$request_time,"rid":"$request_id"}';
  access_log /dev/stdout main;

  limit_req_zone $binary_remote_addr zone=api:20m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream api { server api:8000; keepalive 64; }
  upstream web { server web:3000; keepalive 64; }

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name app.smsflow.lk;   # replace with your domain

    ssl_certificate     /etc/letsencrypt/live/smsflow/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smsflow/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self' https://www.payhere.lk https://sandbox.payhere.lk; frame-ancestors 'none'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/v1/auth/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://api; }
    location /api/        { limit_req zone=api burst=100 nodelay; proxy_pass http://api; }
    location /health/     { proxy_pass http://api; }
    location /            { proxy_pass http://web; }
  }
}
